<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div>
        <button class="open-button" onclick="openForm()">New Book</button>
        <div class="form-popup" id="myForm">
            <form class="form-container">
                <p>New Book</p>
                <label for="titleB">Title of Book</label>
                <input type="text" placeholder="Enter title of book" name="titleB" required>

                <label for="nameA">Name of Author</label>
                <input type="text" placeholder="Enter name of author" name="nameA" required>

                <label for="NoP">Number of Pages</label>
                <input type="text" placeholder="Enter the number of pages" name="NoP" required>

                <label for="readB">Have you read the book?</label>
                <input type="text" placeholder="Enter if you have read the book" name="readB" required>

                <button type="submit" class="btn">Submit</button>
                <button type="button" class="btn cancel" onclick="closeForm()">Cancel</button>
            </form>
        </div>
    </div>
    <script type="text/javascript" src="libraryFunctions.js"></script>
</body>
</html>
