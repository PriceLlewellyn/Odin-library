<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="libraryFunctions.js" defer></script>
</head>
<body>
    <div>
        <button class="open-button" onclick="openForm()">New Book</button>
        <div class="form-popup" id="myForm">
            <form class="form-container">
                <p>New Book</p>
                <label for="title">Title of Book</label>
                <input type="text" placeholder="Enter title of book" name="Title" id="title" required>

                <label for="author">Name of Author</label>
                <input type="text" placeholder="Enter name of author" name="Author" id="author" required>

                <label for="pages">Number of Pages</label>
                <input type="text" placeholder="Enter the number of pages" name="Pages" id="pages" required>

                <label for="read">Have you read the book?</label>
                <input type="text" placeholder="Enter if you have read the book" name="Read" id="read" required>

                <button type="submit" class="btn">Submit</button>
                <button type="button" class="btn cancel" onclick="closeForm()">Cancel</button>
            </form>
        </div>
    </div>

    <h2>Library</h2>
    <table id="book-table" border="1">
        <thread>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Pages</th>
                <th>Read</th>
            </tr>
        </thread>
        <tbody id="book-table-body">

        </tbody>
</body>
</html>
